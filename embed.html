<!--
  DSCR Calculator - iframe Embed Code
  =====================================
  Replace YOUR_STREAMLIT_URL below with your actual Streamlit app URL.
  Example: https://devinday128-dscr-streamlit-app-xyz.streamlit.app

  The ?embedded=true parameter hides the Streamlit toolbar for a cleaner embed.

  OPTION 1: Paste just the <iframe> tag into your website builder (Squarespace, Wix, etc.)
  OPTION 2: Use the full page below for a standalone embed page
-->

<!-- ============================
     COPY THIS IFRAME TAG ONLY
     ============================ -->
<iframe
  src="YOUR_STREAMLIT_URL?embedded=true"
  width="100%"
  height="900"
  style="border: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);"
  title="DSCR Calculator - BrickWood Mortgage"
  loading="lazy"
></iframe>
<!-- ============================
     END IFRAME TAG
     ============================ -->




<!--
  FULL STANDALONE PAGE (optional)
  Use this if you want a dedicated page on your site just for the calculator.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSCR Calculator | BrickWood Mortgage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 2rem 1rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1rem;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    .calculator-container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .calculator-frame {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      background: white;
    }

    .calculator-frame iframe {
      display: block;
      width: 100%;
      height: 950px;
      border: none;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 1.5rem;
      padding-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.5rem;
      }

      .calculator-frame iframe {
        height: 1200px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DSCR Investment Calculator</h1>
    <p>Estimate rental income and calculate Debt Service Coverage Ratio for South Carolina properties.</p>
  </div>

  <div class="calculator-container">
    <div class="calculator-frame">
      <iframe
        src="YOUR_STREAMLIT_URL?embedded=true"
        title="DSCR Calculator - BrickWood Mortgage"
        loading="lazy"
      ></iframe>
    </div>
    <p class="disclaimer">
      Results are estimates for informational purposes only. Contact BrickWood Mortgage for official loan terms.
    </p>
  </div>

</body>
</html>
